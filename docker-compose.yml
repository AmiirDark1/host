services:
  # ===== Nginx Reverse Proxy =====
  nginx-proxy:
    image: nginxproxy/nginx-proxy:latest
    container_name: nginx-proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/tmp/docker.sock:ro
      - ./wordpress-panel/infrastructure/nginx/custom:/etc/nginx/custom:ro
      - ./wordpress-panel/infrastructure/nginx/vhost.d:/etc/nginx/vhost.d
      - ./wordpress-panel/infrastructure/nginx/html:/usr/share/nginx/html
      - ./wordpress-panel/infrastructure/nginx/certs:/etc/nginx/certs:ro
      - ./wordpress-panel/infrastructure/nginx/conf.d:/etc/nginx/conf.d
    networks:
      - nginx-proxy
    labels:
      - "com.github.jrcs.letsencrypt_nginx_proxy_companion.nginx_proxy"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ===== Acme Companion (SSL خودکار) =====
  acme-companion:
    image: nginxproxy/acme-companion:latest
    container_name: acme-companion
    restart: always
    environment:
      - DEFAULT_EMAIL=admin@example.com
      - NGINX_PROXY_CONTAINER=nginx-proxy
      - ACME_CA_URI=https://acme-v02.api.letsencrypt.org/directory
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./wordpress-panel/infrastructure/nginx/certs:/etc/nginx/certs
      - ./wordpress-panel/infrastructure/nginx/vhost.d:/etc/nginx/vhost.d
      - ./wordpress-panel/infrastructure/nginx/html:/usr/share/nginx/html
      - ./wordpress-panel/infrastructure/nginx/acme:/etc/acme.sh
    networks:
      - nginx-proxy
    depends_on:
      - nginx-proxy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ===== Management Panel =====
  wordpress-panel:
    build: .
    container_name: wordpress-panel
    ports:
      - "3000:3000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./wordpress-panel/infrastructure/nginx/certs:/app/infrastructure/nginx/certs
    environment:
      - NODE_ENV=production
      - SERVER_IP=${SERVER_IP:-127.0.0.1}
    restart: unless-stopped
    stop_grace_period: 60s
    privileged: true
    networks:
      - nginx-proxy
    depends_on:
      - nginx-proxy

networks:
  nginx-proxy:
  wordpress-net:
