apiVersion: v1
kind: Secret
metadata:
  name: hosting-secrets
  namespace: hosting-control
type: Opaque
stringData:
  SECRET_KEY: "your-secret-key-here-change-in-production"
  JWT_SECRET: "your-jwt-secret-here-change-in-production"
  JWT_REFRESH_SECRET: "your-jwt-refresh-secret-here-change-in-production"
  DB_PASSWORD: "your-db-password-here-change-in-production"
  ENCRYPTION_KEY: "your-encryption-key-here-32-chars-min"
  SMTP_HOST: "smtp.example.com"
  SMTP_PORT: "587"
  SMTP_USER: "noreply@example.com"
  SMTP_PASSWORD: "your-smtp-password"
  NODE_API_TOKEN: "node-authentication-token-here"
---
apiVersion: v1
kind: Secret
metadata:
  name: node-secrets
  namespace: hosting-control
type: Opaque
stringData:
  NODE_REGISTRATION_TOKEN: "registration-token-for-nodes"