apiVersion: v1
kind: Namespace
metadata:
  name: hosting-control
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: hosting-controller-config
  namespace: hosting-control
data:
  DATABASE_URL: "postgresql+asyncpg://hosting:${DB_PASSWORD}@postgres:5432/hosting_control"
  REDIS_URL: "redis://redis:6379/0"
  CELERY_BROKER_URL: "redis://redis:6379/1"
  SECRET_KEY: "${SECRET_KEY}"
  ENVIRONMENT: "production"
  LOG_LEVEL: "INFO"
  CORS_ORIGINS: "https://panel.example.com"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: hosting-control
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: postgres:16-alpine
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_DB
          value: hosting_control
        - name: POSTGRES_USER
          value: hosting
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: hosting-secrets
              key: db_password
        volumeMounts:
        - name: postgres-data
          mountPath: /var/lib/postgresql/data
        - name: postgres-init
          mountPath: /docker-entrypoint-initdb.d
        resources:
          requests:
            cpu: "1"
            memory: "2Gi"
          limits:
            cpu: "2"
            memory: "4Gi"
      volumes:
      - name: postgres-data
        persistentVolumeClaim:
          claimName: postgres-pvc
      - name: postgres-init
        configMap:
          name: postgres-init
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: hosting-control
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: hosting-control
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        ports:
        - containerPort: 6379
        resources:
          requests:
            cpu: "0.5"
            memory: "1Gi"
          limits:
            cpu: "1"
            memory: "2Gi"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hosting-api
  namespace: hosting-control
spec:
  replicas: 3
  selector:
    matchLabels:
      app: hosting-api
  template:
    metadata:
      labels:
        app: hosting-api
    spec:
      containers:
      - name: api
        image: hosting-control/api:latest
        ports:
        - containerPort: 8000
        envFrom:
        - configMapRef:
            name: hosting-controller-config
        - secretRef:
            name: hosting-secrets
        readinessProbe:
          httpGet:
            path: /api/v1/health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /api/v1/health
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 20
        resources:
          requests:
            cpu: "0.5"
            memory: "512Mi"
          limits:
            cpu: "2"
            memory: "2Gi"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: celery-worker
  namespace: hosting-control
spec:
  replicas: 2
  selector:
    matchLabels:
      app: celery-worker
  template:
    metadata:
      labels:
        app: celery-worker
    spec:
      containers:
      - name: worker
        image: hosting-control/celery:latest
        command: ["celery", "-A", "hosting_control.main_controller.core.celery_app", "worker", "-l", "info", "-Q", "default,provisioning,backups,monitoring"]
        envFrom:
        - configMapRef:
            name: hosting-controller-config
        - secretRef:
            name: hosting-secrets
        resources:
          requests:
            cpu: "0.5"
            memory: "512Mi"
          limits:
            cpu: "2"
            memory: "2Gi"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: celery-beat
  namespace: hosting-control
spec:
  replicas: 1
  selector:
    matchLabels:
      app: celery-beat
  template:
    metadata:
      labels:
        app: celery-beat
    spec:
      containers:
      - name: beat
        image: hosting-control/celery:latest
        command: ["celery", "-A", "hosting_control.main_controller.core.celery_app", "beat", "-l", "info"]
        envFrom:
        - configMapRef:
            name: hosting-controller-config
        - secretRef:
            name: hosting-secrets
        resources:
          requests:
            cpu: "0.3"
            memory: "256Mi"
          limits:
            cpu: "0.5"
            memory: "512Mi"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: hosting-control
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend
        image: hosting-control/frontend:latest
        ports:
        - containerPort: 80
        resources:
          requests:
            cpu: "0.2"
            memory: "128Mi"
          limits:
            cpu: "0.5"
            memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: hosting-control
spec:
  selector:
    app: postgres
  ports:
  - port: 5432
    targetPort: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: hosting-control
spec:
  selector:
    app: redis
  ports:
  - port: 6379
    targetPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: hosting-api
  namespace: hosting-control
spec:
  selector:
    app: hosting-api
  ports:
  - port: 8000
    targetPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: hosting-control
spec:
  selector:
    app: frontend
  ports:
  - port: 80
    targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hosting-ingress
  namespace: hosting-control
  annotations:
    kubernetes.io/ingress.class: traefik
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  tls:
  - hosts:
    - panel.example.com
    - api.panel.example.com
    secretName: hosting-tls
  rules:
  - host: panel.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend
            port:
              number: 80
  - host: api.panel.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: hosting-api
            port:
              number: 8000
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: hosting-api-hpa
  namespace: hosting-control
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: hosting-api
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80