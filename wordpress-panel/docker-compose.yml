services:
  # Management Panel
  wordpress-panel:
    build: .
    container_name: wordpress-panel
    ports:
      - "80:3000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    stop_grace_period: 60s
    privileged: true
