# Prometheus Configuration for Hosting Control Panel Monitoring

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

# Alerting configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets: []

# Rule files
rule_files:
  - "alerts/*.yml"

# Scrape configurations
scrape_configs:
  # Main Controller API metrics
  - job_name: "hosting-api"
    scrape_interval: 10s
    metrics_path: "/api/v1/metrics"
    scheme: http
    static_configs:
      - targets: ["hosting-api:8000"]
        labels:
          service: "api"
          role: "controller"

  # Celery worker metrics
  - job_name: "celery-workers"
    scrape_interval: 15s
    metrics_path: "/metrics"
    static_configs:
      - targets:
          - "hosting-celery-worker:8001"
        labels:
          service: "celery-worker"
          role: "controller"

  # PostgreSQL exporter
  - job_name: "postgres"
    scrape_interval: 30s
    static_configs:
      - targets:
          - "postgres-exporter:9187"
        labels:
          service: "postgres"
          role: "database"

  # Redis exporter
  - job_name: "redis"
    scrape_interval: 30s
    static_configs:
      - targets:
          - "redis-exporter:9121"
        labels:
          service: "redis"
          role: "cache"

  # Docker engine metrics (from each node)
  - job_name: "docker"
    scrape_interval: 15s
    metrics_path: "/metrics"
    scheme: https
    tls_config:
      insecure_skip_verify: true
    static_configs:
      - targets: []
        labels:
          service: "docker"
          role: "container-engine"

  # Node exporter (system metrics from each node)
  - job_name: "node"
    scrape_interval: 15s
    static_configs:
      - targets: []
        labels:
          service: "node-exporter"
          role: "infrastructure"

  # Traefik reverse proxy metrics
  - job_name: "traefik"
    scrape_interval: 15s
    metrics_path: "/metrics"
    static_configs:
      - targets:
          - "traefik:8082"
        labels:
          service: "traefik"
          role: "proxy"