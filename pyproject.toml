[project]
name = "hosting-control-panel"
version = "1.0.0"
description = "Distributed WordPress Hosting Control Panel"
requires-python = ">=3.13"
license = { text = "MIT" }

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.30.0",
    "alembic>=1.13.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "celery>=5.4.0",
    "redis>=5.1.0",
    "pyjwt>=2.9.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.12",
    "websockets>=13.0",
    "docker>=7.1.0",
    "paramiko>=3.5.0",
    "asyncssh>=2.17.0",
    "aiofiles>=24.1.0",
    "httpx>=0.27.0",
    "prometheus-client>=0.20.0",
    "cryptography>=43.0.0",
    "python-dotenv>=1.0.0",
    "pyotp>=2.9.0",
    "qrcode[pil]>=7.4.0",
    "boto3>=1.35.0",
    "minio>=7.2.0",
    "sentry-sdk>=2.14.0",
    "opentelemetry-api>=1.27.0",
    "opentelemetry-sdk>=1.27.0",
    "structlog>=24.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "aiosqlite>=0.20.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "pre-commit>=3.8.0",
]

[build-system]
requires = ["setuptools>=75.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["hosting_control*"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.13"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]